name: ci

# Prevent rapid follow-up PR commits from consuming duplicate hosted-runner
# minutes. The newest commit still requires both Linux and Windows success.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        # Apt mirrors / pip indexes can stall before any test starts. Bound
        # hosted CI setup; fail closed instead of consuming runner time forever.
        timeout-minutes: 8
        run: |
          required_packages=()
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            required_packages+=(ffmpeg)
          fi
          if [ ! -f /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc ]; then
            required_packages+=(fonts-noto-cjk)
          fi
          if (("${#required_packages[@]}" > 0)); then
            echo "Installing missing system dependencies: ${required_packages[*]}"
            sudo timeout --signal=TERM --kill-after=5s 120s \
              apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 update -qq
            sudo env DEBIAN_FRONTEND=noninteractive \
              timeout --signal=TERM --kill-after=5s 180s \
              apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 install -y -qq "${required_packages[@]}"
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          echo "Installing Python dev/media dependencies (bounded)"
          timeout --signal=TERM --kill-after=5s 240s \
            python -m pip install --retries 2 --timeout 30 -e ".[dev,media]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q

  windows-source-pattern:
    # Offline-only Windows integration checks. Never register a real task,
    # run yt-dlp, download public media or require user-PC credentials.
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install offline-test dependencies
        run: python -m pip install -e ".[dev,media]"
      - name: Verify finished cut-extension speech and audio evidence offline
        run: |
          pytest -q tests/test_render_cut_extension_mp4_ab.py tests/test_render_cut_extension_finish_ab.py tests/test_render_cut_extension_speech_audit.py tests/test_render_cut_extension_speech_refine.py tests/test_render_cut_extension_speech_b2.py tests/test_render_cut_extension_speech_b2_finish.py tests/test_render_cut_extension_three_way_diagnostics.py tests/test_render_cut_extension_three_way_triage.py tests/test_render_cut_extension_three_way_dialogue.py tests/test_render_cut_extension_three_way_acoustic.py tests/test_render_cut_extension_three_way_clip_asr.py tests/test_render_cut_extension_clip_asr_alignment.py tests/test_render_three_way_existing_media_pilot.py tests/test_render_three_way_prerequisites.py tests/test_render_three_way_existing_media_autopilot.py tests/test_render_three_way_existing_media_review_batch.py tests/test_render_three_way_b3_local_render.py tests/test_render_three_way_b3_matched_finishing.py tests/test_render_four_way_local_diagnostics.py tests/test_render_b2_b3_finished_audio_asr.py tests/test_render_b2_b3_audio_review.py tests/test_render_b2_b3_local_review_pack.py
      - name: Verify Windows corpus locks and fail-closed diagnostics
        run: |
          pytest -q tests/test_render_same_source_geometry.py tests/test_render_human_edit_context.py tests/test_render_ab_metrics.py tests/test_render_cut_ab_preview.py tests/test_render_subtitle_ab_preview.py tests/test_render_audio_ab_preview.py tests/test_render_review_triage.py tests/test_render_source_context.py tests/test_render_review_calibration.py tests/test_render_quality_review.py tests/test_render_quality_diagnostics.py tests/test_render_visual_style.py tests/test_render_audio_finish.py tests/test_render_subtitle_burnin.py tests/test_render_subtitles.py tests/test_render_ready_queue.py tests/test_render_candidate_autoqueue.py tests/test_render_source_queue.py tests/test_render_source_queue_task.py tests/test_render_source_acquisition.py tests/test_render_source_resolver.py tests/test_render_plan.py tests/test_editorial_boundary_guards.py tests/test_source_pattern_worker.py tests/test_corpus_state_writer_lock.py tests/test_source_pattern_diagnostics.py tests/test_source_ytdlp_lan_client_setup.py tests/test_source_ytdlp_lan_onboarding.py tests/test_source_ytdlp_lan_ssh_transfer.py tests/test_source_ytdlp_lan_setup_doctor.py tests/test_source_ytdlp_lan_pair_evidence.py tests/test_source_ytdlp_lan_pair_collect.py tests/test_source_ytdlp_lan_onboard_check.py tests/test_source_ytdlp_lan_local_bootstrap.py tests/test_source_ytdlp_lan_task_prepare.py tests/test_source_ytdlp_lan_firewall_prepare.py tests/test_source_ytdlp_lan_pc_a_prepare.py tests/test_source_ytdlp_lan_pc_b_prepare.py tests/test_source_ytdlp_lan_deployment_diagnosis.py tests/test_source_ytdlp_lan_pacing_trial.py tests/test_source_ytdlp_lan_evidence_history.py tests/test_source_ytdlp_lan_monitor.py tests/test_source_ytdlp_lan_operator_profile.py tests/test_source_ytdlp_lan_first_run_check.py tests/test_verify_ci_local.py
      - name: Verify real Windows native descendant cleanup without media
        run: |
          pytest -q tests/test_source_ytdlp.py -k "native_process or timeout_terminates_descendant_process"
      - name: Exercise Windows PowerShell launcher with mocked local binaries
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\scripts\test-source-pattern-windows.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell integration checks failed: $LASTEXITCODE" }
      - name: Verify Task Scheduler installer contract without registration
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\scripts\test-source-pattern-install.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell installer contract tests failed: $LASTEXITCODE" }
      - name: Verify LAN coordinator Windows startup and restart offline
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\scripts\test-ytdlp-lan-task.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Windows LAN coordinator task tests failed: $LASTEXITCODE" }
      - name: Verify Windows LAN credential NTFS ACLs on disposable files
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\scripts\test-ytdlp-lan-acl.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Windows LAN credential ACL tests failed: $LASTEXITCODE" }

      - name: Verify Windows Firewall scope against CIDR and multi-rule mock matrix
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\scripts\test-ytdlp-lan-firewall-scope.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Windows LAN firewall scope tests failed: $LASTEXITCODE" }

      - name: Verify preview-first Windows LAN firewall addition using mock rules
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\scripts\test-ytdlp-lan-firewall-prepare.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Windows LAN firewall prepare mock tests failed: $LASTEXITCODE" }

      - name: Verify Windows LAN periodic monitor task using mocked scheduler
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\scripts\test-ytdlp-lan-monitor-task.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Windows LAN monitor task tests failed: $LASTEXITCODE" }

      - name: Verify Windows local post-acquisition render worker with fake uv
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\scripts\test-render-ready-queue-runner.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Windows post-acquisition mock worker failed: $LASTEXITCODE" }

      - name: Verify Windows render source queue task installer with mocked scheduler
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\scripts\test-render-source-queue-task.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Windows render queue scheduler mock failed: $LASTEXITCODE" }

      - name: Verify Windows first-run LAN monitor task probe with mocked scheduler
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\scripts\test-ytdlp-lan-monitor-first-run.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Windows LAN first-run probe checks failed: $LASTEXITCODE" }

      - name: Verify Windows LAN setup inspection using mocked cmdlets
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\scripts\test-ytdlp-lan-setup-doctor.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Windows LAN setup doctor tests failed: $LASTEXITCODE" }

  windows-blind-review:
    # Exercise the actual Windows path, JSON and CRLF behavior of the local
    # blind full-video review pipeline, not only its Linux synthetic tests.
    # Local fixtures only: no real MP4 download, cloud requests or credentials.
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install offline-test dependencies
        run: python -m pip install -e ".[dev,media]"
      - name: Validate blinded full-media study, rating ingestion and edit association
        run: |
          python -m pytest -q tests/test_render_b2_b3_blind_full_study.py tests/test_render_b2_b3_blind_rating_ingest.py tests/test_render_b2_b3_blind_edge_association.py
