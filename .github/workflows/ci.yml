name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install -e ".[dev,media]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q
