name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          python -m pip install -e ".[dev,media]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q

  windows-source-pattern:
    # Offline-only Windows integration checks. Never register a real task,
    # run yt-dlp, download public media or require user-PC credentials.
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install offline-test dependencies
        run: python -m pip install -e ".[dev,media]"
      - name: Verify Windows corpus locks and fail-closed diagnostics
        run: |
          pytest -q tests/test_source_pattern_worker.py tests/test_corpus_state_writer_lock.py tests/test_source_pattern_diagnostics.py
      - name: Exercise Windows PowerShell launcher with mocked local binaries
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\scripts\test-source-pattern-windows.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell integration checks failed: $LASTEXITCODE" }
